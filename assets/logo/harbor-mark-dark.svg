<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 725" width="690" height="725" role="img" aria-label="HARBOR">
  <title>HARBOR</title>
  <!-- A chamfered H with a signal trace routed through it between two nodes: the letterform
       and the dispatch path in one mark.

       The trace and the node rings are holes in the same path rather than shapes painted in
       a background colour, so the mark drops onto any ground. They are wound counter to the
       H outline (which runs clockwise) and rely on nonzero winding — evenodd would XOR the
       overlap between each node ring and the trace back to solid, notching both. -->
  <path fill="#E8F6F8" d="
    M0 58 L58 0 L149 0 L207 58 L207 308 L483 308 L483 58 L541 0 L632 0 L690 58
    L690 667 L632 725 L541 725 L483 667 L483 397 L207 397 L207 667 L149 725
    L58 725 L0 667 Z

    M126.5 178 L126.5 428.5 L563.5 428.5 L563.5 547 L532.5 547 L532.5 397.5
    L157.5 397.5 L157.5 178 Z

    M90 178 a52 52 0 1 0 104 0 a52 52 0 1 0 -104 0 Z
    M496 547 a52 52 0 1 0 104 0 a52 52 0 1 0 -104 0 Z"/>

  <circle cx="142" cy="178" r="30" fill="#0FB6C9"/>
  <circle cx="548" cy="547" r="30" fill="#0FB6C9"/>
</svg>
